<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>서울시 구별 인구 · CCTV 대시보드</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>서울시 구별 인구 현황</h1>
    <p>SQLite DB의 데이터를 API로 불러와 그래프와 표로 보여줍니다.</p>
  </header>

  <section class="cards" id="kpis"></section>

  <section class="controls">
    <div class="group" id="metricBtns"></div>
    <div class="group" id="orderBtns"></div>
  </section>

  <section class="card"><h2 id="barTitle"></h2><div class="chart-box tall"><canvas id="barChart"></canvas></div></section>
  <section class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2>인구수 vs CCTV 수</h2>
      <div class="controls" style="margin:0;"><div class="group" id="scatterYearBtns"></div></div>
    </div>
    <div class="chart-box">
      <canvas id="scatterChart"></canvas>
    </div>
    <div id="regressionCard" style="margin-top:16px; padding:16px; background:#f8fafc; border:1.5px solid #0F3040; border-radius:10px;">
      <h3 style="margin:0 0 12px; font-size:16px; color:#0F3040; display:flex; align-items:center; gap:6px;">
        📐 선형 회귀 분석 (기울기 & y절편)
      </h3>
      <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:12px;">
        <div style="background:#fff; padding:12px; border-radius:8px; border:1px solid #cbd5e1;">
          <span style="color:#64748b; font-size:13px; font-weight:600;">회귀 방정식 (y = ax + b)</span>
          <b id="regEq" style="display:block; font-size:17px; color:#0F3040; margin-top:4px;">-</b>
        </div>
        <div style="background:#fff; padding:12px; border-radius:8px; border:1px solid #cbd5e1;">
          <span style="color:#64748b; font-size:13px; font-weight:600;">기울기 (Slope, a)</span>
          <b id="regSlope" style="display:block; font-size:17px; color:#030164; margin-top:4px;">-</b>
        </div>
        <div style="background:#fff; padding:12px; border-radius:8px; border:1px solid #cbd5e1;">
          <span style="color:#64748b; font-size:13px; font-weight:600;">y절편 (Intercept, b)</span>
          <b id="regIntercept" style="display:block; font-size:17px; color:#030164; margin-top:4px;">-</b>
        </div>
        <div style="background:#fff; padding:12px; border-radius:8px; border:1px solid #cbd5e1;">
          <span style="color:#64748b; font-size:13px; font-weight:600;">설명력 (R² 결정계수)</span>
          <b id="regR2" style="display:block; font-size:17px; color:#030164; margin-top:4px;">-</b>
        </div>
      </div>
      <div style="margin-top:12px; font-size:14px; color:#1e293b; line-height:1.6; background:#fff; padding:12px; border-radius:8px; border:1px solid #cbd5e1;" id="regSummary">
      </div>
    </div>
  </section>
<section class="card">
  <h2 id="growthTitle">연평균 CCTV 증가율 순위</h2>
  <div class="chart-box tall">
    <canvas id="growthChart"></canvas>
  </div>
</section>
<section class="card">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <h2 id="growthYearTitle">선택 년도 CCTV 증가율 순위</h2>
    <div class="controls" style="margin:0;"><div class="group" id="growthYearBtns"></div></div>
  </div>
  <div class="chart-box tall">
    <canvas id="growthYearChart"></canvas>
  </div>
</section>
<!-- Yearly CCTV chart -->
<section class="card">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <h2 id="cctvYearTitle">년도별 CCTV 설치 현황</h2>
    <div class="controls" style="margin:0;"><div class="group" id="yearBtns"></div></div>
  </div>
  <div class="chart-box tall">
    <canvas id="cctvYearChart"></canvas>
  </div>
</section>

  <section class="card">
    <h2>📊 CCTV 연도별(2014/2015/2016) 설치 현황 및 연평균 증가율 (%)</h2>
    <div id="cctvTableWrap" class="cctv-table-wrap"></div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
